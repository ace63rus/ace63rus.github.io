<script>
const D = JSON.parse(document.getElementById('data').textContent);
const fmt = n => n ? n.toLocaleString('ru-RU') : '—';
const price = o => {
  if (o.lo && o.hi && o.lo !== o.hi) return fmt(o.lo) + '–' + fmt(o.hi) + ' ₽';
  if (o.top) return fmt(o.top) + ' ₽';
  return 'по договорённости';
};
const offCls = n => n <= 3 ? 'good' : (n <= 10 ? 'mid' : 'bad');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('meta').textContent =
  'Снимок ' + D.generated + ' · источник: перепись биржи (HTTP + stateData) · ' +
  'парсер: tools\\kwork_parser';

document.getElementById('kpis').innerHTML = [
  [D.total, 'заказов на бирже'],
  [D.core_orders, 'в ЯДРЕ стека'],
  [D.clean, 'всего нашего, без мусора'],
  [D.core_cats, 'категорий в ядре'],
].map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');

const q = document.getElementById('q'),
      minb = document.getElementById('minb'),
      mo = document.getElementById('mo'),
      sort = document.getElementById('sort'),
      btnCore = document.getElementById('scopeCore'),
      btnAll = document.getElementById('scopeAll');

let scope = 'core';   // по умолчанию — только ЯДРО стека
btnCore.addEventListener('click', () => {
  scope = 'core'; btnCore.classList.add('on'); btnAll.classList.remove('on'); render();
});
btnAll.addEventListener('click', () => {
  scope = 'all'; btnAll.classList.add('on'); btnCore.classList.remove('on'); render();
});

function filtered(cat) {
  const term = q.value.trim().toLowerCase();
  const min = +minb.value, maxOff = +mo.value;
  return cat.orders.filter(o => {
    if (o.top < min) return false;
    if (o.offers > maxOff) return false;
    if (term && !(o.title + ' ' + o.desc).toLowerCase().includes(term)) return false;
    return true;
  });
}

function render() {
  const cats = D.categories
    .filter(c => scope === 'all' || c.core)
    .map(c => ({...c, view: filtered(c)}))
    .filter(c => c.view.length);
  const s = sort.value;
  if (s === 'count') cats.sort((a, b) => b.view.length - a.view.length);
  if (s === 'budget') cats.sort((a, b) => b.med_budget - a.med_budget);
  if (s === 'comp') cats.sort((a, b) => (a.med_offers - b.med_offers) || (b.med_budget - a.med_budget));
  if (s === 'group') cats.sort((a, b) => a.group.localeCompare(b.group) || b.view.length - a.view.length);

  const total = cats.reduce((n, c) => n + c.view.length, 0);
  document.getElementById('hint').textContent =
    `показано ${total} заказов в ${cats.length} категориях · режим: ` +
    (scope === 'core' ? 'ЯДРО (то, что делаем профессионально)' : 'всё наше, включая смежное');

  if (!cats.length) { document.getElementById('main').innerHTML = '<div class="empty">Ничего не найдено — ослабь фильтры.</div>'; return; }

  document.getElementById('main').innerHTML = cats.map((c, i) => `
    <details class="cat" ${(scope === 'core' || i < 6) ? 'open' : ''}>
      <summary>
        <span class="caret">▶</span>
        <span class="cname">${esc(c.name)}</span>
        ${c.core ? '<span class="badge-core">ЯДРО</span>' : ''}
        <span class="cid">кат ${c.id}</span>
        <span class="grp">${esc(c.group)}</span>
        <span class="stats">
          <span class="st"><b>${c.view.length}</b> заказ.</span>
          <span class="st">мед. откл <b>${c.med_offers}</b></span>
          <span class="st">мед. бюджет <b>${fmt(c.med_budget)} ₽</b></span>
          <span class="st">≤5 откл <b>${c.low_comp}</b></span>
        </span>
      </summary>
      <table>
        <thead><tr><th style="width:118px">Бюджет</th><th style="width:62px">Откл</th>
        <th style="width:88px">Создан</th><th>Заказ · ссылка</th></tr></thead>
        <tbody>${c.view.map(o => `
          <tr data-url="${o.url}">
            <td class="budget ${o.top ? '' : 'zero'}">${price(o)}</td>
            <td><span class="off ${offCls(o.offers)}">${o.offers}</span></td>
            <td class="dt">${o.date}</td>
            <td>
              <a class="ttl" href="${o.url}" target="_blank" rel="noopener">${esc(o.title)}</a><span class="go">↗</span>
              <span class="dsc">${esc(o.desc)}</span>
              <span class="url" data-link="${o.url}" title="клик — скопировать ссылку">${o.url}</span>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </details>`).join('');
}

[q, minb, mo, sort].forEach(el => el.addEventListener('input', render));

function copyText(s) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s);
  const ta = document.createElement('textarea');
  ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

// клик по URL-плашке — скопировать ссылку; клик по остальной строке — открыть заказ
document.getElementById('main').addEventListener('click', e => {
  const u = e.target.closest('.url');
  if (u) {
    const link = u.dataset.link || u.textContent.trim();
    copyText(link);
    const old = u.textContent;
    u.textContent = '✓ ссылка скопирована';
    setTimeout(() => { u.textContent = old; }, 900);
    return;
  }
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr[data-url]');
  if (tr) window.open(tr.dataset.url, '_blank', 'noopener');
});

render();
</script>
</body>
</html>
